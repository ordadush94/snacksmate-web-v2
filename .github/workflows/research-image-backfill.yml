name: Research Image Backfill

# SAFETY: manual only. There is no schedule.
# Dry-run is the default. It reads Research documents and writes nothing.
# A write is possible only when dry_run is false AND confirm_write matches the mode.
# missing_only requires GENERATE RESEARCH IMAGES.
# ai_generated_only requires REGENERATE RESEARCH IMAGES and replaces only images
# whose imageAutomation record still matches the current asset.
# Manual uploads are never replaced.
# Writes patch the existing Research mainImage field, the alt text nested on
# that image, and the internal imageAutomation provenance. Drafts stay
# unpublished. This workflow never publishes and never creates Research documents.
# The Monday/Thursday Research Discovery schedule is unchanged.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview which Research studies need images without generating or writing images.
        type: boolean
        required: false
        default: true
      scope:
        description: all_missing includes every logical study. published_missing only studies with a published document. drafts_missing only unpublished drafts.
        type: choice
        options:
          - all_missing
          - published_missing
          - drafts_missing
        default: all_missing
      max_images:
        description: How many new images to generate. Use an integer from 1 to 50, or ALL. English and Hebrew count as one study.
        type: string
        required: false
        default: "10"
      regeneration_mode:
        description: missing_only creates images only where one is absent. ai_generated_only replaces images that still carry Research image-automation provenance. Manual uploads are never replaced.
        type: choice
        options:
          - missing_only
          - ai_generated_only
        default: missing_only
      confirm_write:
        description: Required when dry-run is unchecked. Type GENERATE RESEARCH IMAGES for missing_only. Type REGENERATE RESEARCH IMAGES for ai_generated_only. This never publishes.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backfill-images:
    name: Backfill research images
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run research image backfill
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_IMAGE_MODEL: ${{ vars.RESEARCH_IMAGE_MODEL }}
          RESEARCH_AI_MODEL: ${{ vars.RESEARCH_AI_MODEL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: 8wc8eouj
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2026-09-22"
          IMAGE_DRY_RUN: ${{ github.event.inputs.dry_run }}
          IMAGE_SCOPE: ${{ github.event.inputs.scope || 'all_missing' }}
          IMAGE_MAX: ${{ github.event.inputs.max_images || '10' }}
          IMAGE_REGENERATION_MODE: ${{ github.event.inputs.regeneration_mode || 'missing_only' }}
          IMAGE_CONFIRM: ${{ github.event.inputs.confirm_write }}
        run: |
          echo "Research image backfill is manual. It never publishes."
          if [ -z "$IMAGE_SCOPE" ]; then
            IMAGE_SCOPE=all_missing
          fi
          case "$IMAGE_SCOPE" in
            all_missing|published_missing|drafts_missing) ;;
            *)
              echo "Invalid scope: $IMAGE_SCOPE"
              exit 1
              ;;
          esac
          if [ -z "$IMAGE_MAX" ]; then
            IMAGE_MAX=10
          fi
          if [ -z "$IMAGE_REGENERATION_MODE" ]; then
            IMAGE_REGENERATION_MODE=missing_only
          fi
          case "$IMAGE_REGENERATION_MODE" in
            missing_only|ai_generated_only) ;;
            *)
              echo "Invalid regeneration_mode: $IMAGE_REGENERATION_MODE"
              echo "Exiting before image generation or any Sanity write."
              exit 1
              ;;
          esac
          if [ "$IMAGE_MAX" != "ALL" ]; then
            if ! [[ "$IMAGE_MAX" =~ ^[1-9][0-9]?$ ]] || [ "$IMAGE_MAX" -lt 1 ] || [ "$IMAGE_MAX" -gt 50 ]; then
              echo "max_images must be an integer from 1 to 50, or ALL. Received: $IMAGE_MAX"
              echo "Exiting before image generation or any Sanity write."
              exit 1
            fi
          fi
          if [ "$IMAGE_DRY_RUN" = "false" ]; then
            if [ "$IMAGE_REGENERATION_MODE" = "ai_generated_only" ]; then
              if [ "$IMAGE_CONFIRM" != "REGENERATE RESEARCH IMAGES" ]; then
                echo "Refusing to replace images. When dry-run is unchecked and regeneration_mode is ai_generated_only, set confirm_write to exactly: REGENERATE RESEARCH IMAGES"
                echo "Exiting before image generation or any Sanity write."
                exit 1
              fi
              echo "Mode: regenerate. Only images with Research image-automation provenance can be replaced. This never publishes."
            else
              if [ "$IMAGE_CONFIRM" != "GENERATE RESEARCH IMAGES" ]; then
                echo "Refusing to write. When dry-run is unchecked, set confirm_write to exactly: GENERATE RESEARCH IMAGES"
                echo "Exiting before image generation or any Sanity write."
                exit 1
              fi
              echo "Mode: write. Missing images only. Manual uploads stay in place. Drafts stay unpublished."
            fi
            echo "Logical studies, missing images, existing images, images eligible for regeneration, images to generate, image model, and estimated API calls are printed before the first image request."
            npm run research:image-backfill -- --write --scope="$IMAGE_SCOPE" --max-images="$IMAGE_MAX" --regeneration-mode="$IMAGE_REGENERATION_MODE" --confirm="$IMAGE_CONFIRM"
          else
            echo "Mode: dry-run. No images will be generated. No Sanity documents will be modified or published."
            npm run research:image-backfill -- --dry-run --scope="$IMAGE_SCOPE" --max-images="$IMAGE_MAX" --regeneration-mode="$IMAGE_REGENERATION_MODE"
          fi
