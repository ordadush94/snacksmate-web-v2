name: Replace Research Images

# SAFETY: manual only. There is no schedule.
# Dry-run is the default. It reads Research documents and writes nothing.
# A write replaces the current cover of each selected logical study that
# already has an image. English and Hebrew share one new image.
# This includes images that have no automation provenance.
# A write is possible only when dry_run is false AND confirm_write is exactly
# REPLACE EXISTING RESEARCH IMAGES.
# Studies with no image are left for Research Image Backfill.
# Drafts stay unpublished. This workflow never publishes and never creates
# Research documents.
# The Monday/Thursday Research Discovery schedule is unchanged.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview which existing Research covers would be replaced. No image is generated and nothing is written.
        type: boolean
        required: false
        default: true
      scope:
        description: all_missing updates every logical study that already has an image. published_missing only published documents. drafts_missing only unpublished drafts.
        type: choice
        options:
          - all_missing
          - published_missing
          - drafts_missing
        default: all_missing
      max_images:
        description: How many existing covers to replace. Use an integer from 1 to 50, or ALL. English and Hebrew count as one study.
        type: string
        required: false
        default: "10"
      confirm_write:
        description: Required when dry-run is unchecked. Type REPLACE EXISTING RESEARCH IMAGES to replace current covers. This never publishes.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  replace-images:
    name: Replace existing research images
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replace existing research images
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_IMAGE_MODEL: ${{ vars.RESEARCH_IMAGE_MODEL }}
          RESEARCH_AI_MODEL: ${{ vars.RESEARCH_AI_MODEL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: 8wc8eouj
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2026-09-22"
          IMAGE_DRY_RUN: ${{ github.event.inputs.dry_run }}
          IMAGE_SCOPE: ${{ github.event.inputs.scope || 'all_missing' }}
          IMAGE_MAX: ${{ github.event.inputs.max_images || '10' }}
          IMAGE_CONFIRM: ${{ github.event.inputs.confirm_write }}
        run: |
          echo "Replace Research Images is manual. It never publishes."
          if [ -z "$IMAGE_SCOPE" ]; then
            IMAGE_SCOPE=all_missing
          fi
          case "$IMAGE_SCOPE" in
            all_missing|published_missing|drafts_missing) ;;
            *)
              echo "Invalid scope: $IMAGE_SCOPE"
              exit 1
              ;;
          esac
          if [ -z "$IMAGE_MAX" ]; then
            IMAGE_MAX=10
          fi
          if [ "$IMAGE_MAX" != "ALL" ]; then
            if ! [[ "$IMAGE_MAX" =~ ^[1-9][0-9]?$ ]] || [ "$IMAGE_MAX" -lt 1 ] || [ "$IMAGE_MAX" -gt 50 ]; then
              echo "max_images must be an integer from 1 to 50, or ALL. Received: $IMAGE_MAX"
              echo "Exiting before image generation or any Sanity write."
              exit 1
            fi
          fi
          if [ "$IMAGE_DRY_RUN" = "false" ]; then
            if [ "$IMAGE_CONFIRM" != "REPLACE EXISTING RESEARCH IMAGES" ]; then
              echo "Refusing to replace images. When dry-run is unchecked, set confirm_write to exactly: REPLACE EXISTING RESEARCH IMAGES"
              echo "Exiting before image generation or any Sanity write."
              exit 1
            fi
            echo "Mode: replace existing covers. One new image per logical study. Drafts stay unpublished."
            echo "Logical studies, missing images, existing images, images eligible for regeneration, images to generate, image model, and estimated API calls are printed before the first image request."
            npm run research:image-backfill -- --write --scope="$IMAGE_SCOPE" --max-images="$IMAGE_MAX" --regeneration-mode=replace_existing --confirm="$IMAGE_CONFIRM"
          else
            echo "Mode: dry-run. No images will be generated. No Sanity documents will be modified or published."
            npm run research:image-backfill -- --dry-run --scope="$IMAGE_SCOPE" --max-images="$IMAGE_MAX" --regeneration-mode=replace_existing
          fi
