name: Deploy Sanity Studio

# Manual only. Deploys the existing hosted Studio at
# https://snacksmate.sanity.studio.
# Project 8wc8eouj, dataset production, app id ptpammm4gmsm9u7eiy7b20mc
# (studioHost and deployment.appId in sanity.cli.ts).
# Does not create a Sanity project, does not create a hostname, and does not
# publish content. Does not run on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy existing hosted Studio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require SANITY_AUTH_TOKEN
        run: |
          if [ -z "${SANITY_AUTH_TOKEN}" ]; then
            echo "::error::SANITY_AUTH_TOKEN is missing. Add a repository secret named SANITY_AUTH_TOKEN (a Sanity token that can deploy the existing Studio), then run this workflow again."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy the existing hosted Studio
        run: npx --yes sanity@latest deploy --yes
