name: Deploy Studio

# Manual only. Deploys the existing hosted Studio (studioHost snacksmate,
# appId in sanity.cli.ts). It does not create a project and it does not publish content.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Check slug query and deploy Studio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run locale slug query against production
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: npx tsx scripts/check-locale-slug.ts

      - name: Deploy the existing hosted Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: npx sanity deploy --yes
