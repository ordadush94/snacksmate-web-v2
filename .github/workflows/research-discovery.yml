name: Research Discovery

# SAFETY: the Monday/Thursday schedule creates at most 10 unpublished English drafts,
# then enriches them, generates one Research image for each new draft, and creates
# Hebrew drafts that reuse that same Sanity image. It never publishes.
# Review candidates and rejections are log-only.
# workflow_dispatch dry-run remains the default and writes nothing.
# A manual write (dry-run unchecked) still creates English drafts only, with no cap,
# and does not enrich or translate.
# Manual full automation is separate. It runs only when run_full_automation is true
# and confirm_automation is exactly RUN AUTOMATION. It calls the same research:automate
# runner as the schedule, creates drafts only, generates images only for those new
# drafts, and never publishes.
# The discovery dry_run input is not applied to that mode.
# A named-study import runs only when confirm_automation is exactly IMPORT NAMED STUDIES.
# That mode creates unpublished English drafts for a fixed PubMed list, then enriches
# them and creates Hebrew drafts. It never publishes. dry_run does not apply to it.
# Recovery runs only when confirm_automation is exactly RECOVER RESEARCH DRAFTS.
# It resumes PMIDs 42925061 and 42923131 only. PMID 42948631 is not included.
# The workflow dry_run input applies: checked means read Sanity and print the
# plan, with no OpenAI calls and no Sanity writes. Unchecked is the live run.
# Recovery does not search PubMed, does not create English drafts, and does not publish.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run only. Leave this checked. Uncheck only to create Sanity drafts manually.
        type: boolean
        default: true
      lookback_days:
        description: Days of newly indexed PubMed records to search
        type: string
        required: false
        default: "14"
      run_full_automation:
        description: "Run the full Research automation pipeline: Discovery → English draft → AI enrichment + SEO → Research image → Hebrew draft. Leave unchecked to keep the existing Research Discovery behavior."
        type: boolean
        required: false
        default: false
      max_creates:
        description: "Full automation only. Maximum new studies to draft in this run, from 1 to 10. The first smoke test should use 1. Ignored unless full automation is checked."
        type: number
        required: false
        default: 1
      confirm_automation:
        description: "Type RUN AUTOMATION for full automation, IMPORT NAMED STUDIES to import the fixed PubMed list, or RECOVER RESEARCH DRAFTS to resume PMIDs 42925061 and 42923131. Leave empty for Research Discovery. Dry-run stays checked unless a live recovery is intended. This never publishes."
        type: string
        required: false
        default: ""
  schedule:
    # Monday and Thursday 08:00 UTC. Creates at most 10 unpublished drafts, then enriches, illustrates, and translates them.
    - cron: "0 8 * * 1,4"

permissions:
  contents: read

jobs:
  discover:
    name: Discover research drafts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run research discovery
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          NCBI_CONTACT_EMAIL: ${{ secrets.NCBI_CONTACT_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_AI_MODEL: ${{ vars.RESEARCH_AI_MODEL }}
          RESEARCH_IMAGE_MODEL: ${{ vars.RESEARCH_IMAGE_MODEL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: 8wc8eouj
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2026-09-22"
          RESEARCH_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
          # True only for a manual run with dry-run explicitly disabled.
          # Scheduled runs use the draft pipeline instead of this flag.
          WRITE_DRAFTS: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == false || github.event.inputs.dry_run == 'false') }}
          RUN_FULL_AUTOMATION: ${{ github.event.inputs.run_full_automation }}
          MAX_CREATES: ${{ github.event.inputs.max_creates }}
          CONFIRM_AUTOMATION: ${{ github.event.inputs.confirm_automation }}
        run: |
          echo "Only AUTO_DRAFT records can create Sanity drafts. REVIEW_CANDIDATE records are never written."
          echo "Published: 0"
          if [ "$CONFIRM_AUTOMATION" = "RECOVER RESEARCH DRAFTS" ]; then
            echo "Mode: recover existing Research drafts 42925061 and 42923131. Discovery is not run. English drafts are not created. Nothing is published."
            if [ "$WRITE_DRAFTS" = "true" ]; then
              echo "Recovery dry_run: false"
              RECOVER_CONFIRM="RECOVER RESEARCH DRAFTS" npm run research:recover -- --write
            else
              echo "Recovery dry-run. No OpenAI calls and no Sanity writes."
              echo "Recovery dry_run: true"
              RECOVER_CONFIRM="RECOVER RESEARCH DRAFTS" npm run research:recover -- --dry-run
            fi
            exit $?
          fi
          if [ "$CONFIRM_AUTOMATION" = "IMPORT NAMED STUDIES" ]; then
            echo "Mode: named study import. Creates unpublished English drafts, enriches them, and creates Hebrew drafts. Nothing is published."
            IMPORT_CONFIRM="CREATE DRAFTS" npm run research:import-selected -- --write
            exit $?
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "Mode: scheduled draft pipeline. At most 10 new English drafts, then enrichment, one Research image each, and Hebrew drafts. Nothing is published."
            npm run research:automate -- --max-creates=10
          elif [ "$RUN_FULL_AUTOMATION" = "true" ]; then
            # Reject before npm so the automation runner never starts and nothing is written.
            if [ "$CONFIRM_AUTOMATION" != "RUN AUTOMATION" ]; then
              echo "Invalid confirmation. Manual full automation requires confirm_automation to be exactly: RUN AUTOMATION"
              echo "The confirmation was invalid, so this run stopped before any Sanity write."
              echo "Published: 0"
              exit 1
            fi
            # Integers 1–10 only. Leading zeros are rejected so bash cannot treat 08 as octal.
            if ! [[ "$MAX_CREATES" =~ ^[1-9][0-9]?$ ]] || [ "$MAX_CREATES" -gt 10 ]; then
              echo "Invalid max_creates. Manual full automation requires an integer from 1 to 10. Received: ${MAX_CREATES-<empty>}"
              echo "This run stopped before any Sanity write."
              echo "Published: 0"
              exit 1
            fi
            echo "Mode: manual full automation"
            echo "Max creates: $MAX_CREATES"
            echo "Discovery dry-run is not used. This mode creates unpublished drafts, illustrates those new drafts, and does not publish."
            RESEARCH_AUTOMATION_MODE=manual npm run research:automate -- --max-creates="$MAX_CREATES"
          elif [ "$WRITE_DRAFTS" = "true" ]; then
            echo "Mode: create Sanity drafts (manual opt-in). Enrichment and Hebrew translation are not run."
            npm run research:discover
          else
            echo "Mode: dry-run. No Sanity documents will be created or modified."
            npm run research:discover -- --dry-run
          fi
