name: Research Discovery

# SAFETY: every scheduled run is dry-run only and must not create or modify Sanity documents.
# A real draft-creation run is possible only from workflow_dispatch when "dry_run" is explicitly false.
# The manual dry-run input defaults to true.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run only. Leave this checked. Uncheck only to create Sanity drafts manually.
        type: boolean
        default: true
      lookback_days:
        description: Days of newly indexed PubMed records to search
        type: string
        required: false
        default: "14"
  schedule:
    # Monday and Thursday 08:00 UTC. These runs always pass --dry-run.
    - cron: "0 8 * * 1,4"

permissions:
  contents: read

jobs:
  discover:
    name: Discover research drafts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run research discovery
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          NCBI_CONTACT_EMAIL: ${{ secrets.NCBI_CONTACT_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: 8wc8eouj
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2026-09-22"
          RESEARCH_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
          # True only for a manual run with dry-run explicitly disabled.
          # Scheduled runs, and manual runs that leave dry-run checked, stay false.
          WRITE_DRAFTS: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == false || github.event.inputs.dry_run == 'false') }}
        run: |
          echo "Scheduled Monday/Thursday runs always use --dry-run."
          echo "Manual runs create Sanity drafts only when dry-run is explicitly disabled."
          if [ "$WRITE_DRAFTS" = "true" ]; then
            echo "Mode: create Sanity drafts (manual opt-in)."
            npm run research:discover
          else
            echo "Mode: dry-run. No Sanity documents will be created or modified."
            npm run research:discover -- --dry-run
          fi
